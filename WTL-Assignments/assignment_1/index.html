<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deva Hotel - Digital Self Ordering Service</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 30px 15px;
        }
        .order-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
            max-width: 750px;
            margin: 0 auto;
        }
        .header-banner {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header-banner h1 {
            font-weight: 700;
            margin: 0;
        }
        .form-section {
            padding: 35px;
        }
        .btn-order {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-order:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="order-card">
            <div class="header-banner">
                <h1>🍽 Deva Hotel</h1>
                <p class="mb-0 opacity-90">Digital Contactless Table Ordering System</p>
            </div>
            <div class="form-section">
                <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold"><i class="bi bi-person me-1"></i> Customer Name</label>
                            <input type="text" class="form-control form-control-lg" required placeholder="Enter your full name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold"><i class="bi bi-geo-alt me-1"></i> Table Number</label>
                            <input type="number" class="form-control form-control-lg" min="1" max="50" required placeholder="Table No (1-50)">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold"><i class="bi bi-cup-hot me-1"></i> Select Food Item</label>
                            <select class="form-select form-select-lg" id="foodItem" required onchange="updatePrice()">
                                <option value="" selected disabled>Select delicious dish...</option>
                                <option value="180">Shev-Bhaji Special (₹180)</option>
                                <option value="220">Paneer Butter Masala (₹220)</option>
                                <option value="260">Fish Fry (₹260)</option>
                                <option value="290">Butter Chicken (₹290)</option>
                                <option value="240">Kaju Curry Masala (₹240)</option>
                                <option value="150">Daal Tadka Jeera Rice (₹150)</option>
                                <option value="190">Veg Kolhapuri (₹190)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold"><i class="bi bi-sort-numeric-up me-1"></i> Quantity</label>
                            <input type="number" class="form-control form-control-lg" id="qty" min="1" max="10" value="1" required onchange="updatePrice()">
                        </div>
                        <div class="col-12">
                            <div class="alert alert-light border d-flex justify-content-between align-items-center mb-0">
                                <span class="fw-semibold">Estimated Total Amount:</span>
                                <span class="fs-4 fw-bold text-success" id="totalAmount">₹0</span>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold"><i class="bi bi-chat-left-text me-1"></i> Special Cooking Instructions</label>
                            <textarea class="form-control" rows="3" placeholder="e.g. Less spicy, extra butter, no onion/garlic..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold d-block"><i class="bi bi-credit-card me-1"></i> Payment Method</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="payment" id="payUpi" checked>
                                <label class="btn btn-outline-primary" for="payUpi"><i class="bi bi-qr-code me-1"></i> UPI / GPay</label>

                                <input type="radio" class="btn-check" name="payment" id="payCash">
                                <label class="btn btn-outline-primary" for="payCash"><i class="bi bi-cash me-1"></i> Cash on Table</label>

                                <input type="radio" class="btn-check" name="payment" id="payCard">
                                <label class="btn btn-outline-primary" for="payCard"><i class="bi bi-credit-card me-1"></i> Card Swipe</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-order btn-lg w-100 shadow-sm">
                                <i class="bi bi-send-check me-2"></i> Place Order to Kitchen
                            </button>
                        </div>
                    </div>
                </form>

                <div id="orderSuccess" class="alert alert-success mt-4 d-none" role="alert">
                    <h5 class="alert-heading"><i class="bi bi-check-circle-fill me-2"></i> Order Placed Successfully!</h5>
                    <p class="mb-0">Your order has been sent to the kitchen. Order Token: <strong id="orderToken">#DH-101</strong>. Estimated delivery: 15-20 mins.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updatePrice() {
            const select = document.getElementById('foodItem');
            const unitPrice = parseInt(select.value) || 0;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            document.getElementById('totalAmount').innerText = '₹' + (unitPrice * qty);
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            const token = '#DH-' + Math.floor(100 + Math.random() * 900);
            document.getElementById('orderToken').innerText = token;
            const box = document.getElementById('orderSuccess');
            box.classList.remove('d-none');
            box.scrollIntoView({ behavior: 'smooth' });
            e.target.reset();
            document.getElementById('totalAmount').innerText = '₹0';
        }
    </script>
</body>
</html>
