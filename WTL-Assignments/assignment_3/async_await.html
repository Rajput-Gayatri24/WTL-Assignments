<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Public API Fetcher (Async/Await) | WTL Assignment 3</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --bg-dark: #090d16;
            --surface: #111827;
            --surface-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge-chip {
            display: inline-block;
            background: rgba(79, 70, 229, 0.15);
            border: 1px solid rgba(79, 70, 229, 0.3);
            color: #818cf8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Controls Panel */
        .controls-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .api-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-btn:hover {
            color: white;
            border-color: #6366f1;
        }

        .api-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .action-button {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35);
        }

        /* Results Display Card */
        .result-container {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Loading Spinner */
        .loader-box {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1f2937;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Content Render Elements */
        .joke-card {
            text-align: center;
        }

        .joke-setup {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .joke-punchline {
            font-size: 1.35rem;
            color: #38bdf8;
            font-weight: 500;
            background: rgba(56, 189, 248, 0.08);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 18px 24px;
            display: inline-block;
        }

        .quote-card {
            text-align: center;
        }

        .quote-text {
            font-size: 1.5rem;
            font-style: italic;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        .quote-author {
            color: #818cf8;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .user-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #818cf8;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.3);
        }

        .user-details h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .user-details p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

        /* Metadata info */
        .api-meta-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .code-pill {
            font-family: monospace;
            background: #1f2937;
            padding: 4px 10px;
            border-radius: 6px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header class="header">
            <span class="badge-chip"><i class="fa-solid fa-code me-1"></i> WTL Assignment 3</span>
            <h1>Public API Fetcher</h1>
            <p>Demonstrating Modern JavaScript <code>Fetch API</code>, <code>Async/Await</code> & Dynamic DOM Manipulation</p>
        </header>

        <!-- API Controls -->
        <div class="controls-card">
            <div class="api-selector">
                <button class="api-btn active" onclick="selectApi('joke', this)">
                    <i class="fa-regular fa-face-laugh-beam"></i> Random Joke API
                </button>
                <button class="api-btn" onclick="selectApi('quote', this)">
                    <i class="fa-solid fa-quote-left"></i> Quotes API
                </button>
                <button class="api-btn" onclick="selectApi('user', this)">
                    <i class="fa-solid fa-user"></i> Random User API
                </button>
            </div>
            <button class="action-button" onclick="fetchCurrentApi()">
                <i class="fa-solid fa-rotate"></i> Fetch New Data
            </button>
        </div>

        <!-- Dynamic Results Display -->
        <div class="result-container" id="resultContainer">
            <!-- Rendered by DOM Manipulation -->
        </div>

        <div class="api-meta-footer">
            <span>Status: <span class="code-pill" id="httpStatus">HTTP 200 OK</span></span>
            <span>API URL: <span class="code-pill" id="endpointUrl">https://official-joke-api.appspot.com/random_joke</span></span>
        </div>
    </div>

    <script>
        let selectedType = 'joke';

        const API_ENDPOINTS = {
            joke: 'https://official-joke-api.appspot.com/random_joke',
            quote: 'https://api.quotable.io/random',
            user: 'https://randomuser.me/api/'
        };

        function selectApi(type, btnElement) {
            selectedType = type;
            document.querySelectorAll('.api-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            fetchCurrentApi();
        }

        // Asynchronous function using Fetch & Async/Await
        async function fetchCurrentApi() {
            const container = document.getElementById('resultContainer');
            const urlDisplay = document.getElementById('endpointUrl');
            const statusDisplay = document.getElementById('httpStatus');

            const url = API_ENDPOINTS[selectedType];
            urlDisplay.innerText = url;
            statusDisplay.innerText = 'Fetching...';

            // 1. Show Loading State via DOM
            container.innerHTML = `
                <div class="loader-box">
                    <div class="spinner"></div>
                    <p style="color: #9ca3af;">Calling public REST API asynchronously...</p>
                </div>
            `;

            try {
                // 2. Await fetch request
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Server returned HTTP Error: ${response.status} ${response.statusText}`);
                }

                statusDisplay.innerText = `HTTP ${response.status} OK`;

                // 3. Await JSON parsing
                const data = await response.json();

                // 4. Dynamic DOM Manipulation based on API response
                if (selectedType === 'joke') {
                    renderJoke(data, container);
                } else if (selectedType === 'quote') {
                    renderQuote(data, container);
                } else if (selectedType === 'user') {
                    renderUser(data.results[0], container);
                }

            } catch (error) {
                // 5. Catch block for network/API errors
                statusDisplay.innerText = 'Request Failed';
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <h4 style="margin-bottom: 6px;">Failed to Fetch API Data</h4>
                        <p style="font-size: 0.9rem;">${error.message}</p>
                        <button onclick="fetchCurrentApi()" class="action-button" style="margin: 15px auto 0 auto; padding: 8px 16px;">
                            <i class="fa-solid fa-arrow-rotate-right"></i> Try Again
                        </button>
                    </div>
                `;
            }
        }

        function renderJoke(data, container) {
            container.innerHTML = `
                <div class="joke-card">
                    <span class="badge-chip" style="margin-bottom: 16px;">Category: ${data.type.toUpperCase()}</span>
                    <h3 class="joke-setup">"${data.setup}"</h3>
                    <div class="joke-punchline">
                        <i class="fa-regular fa-face-grin-squint me-2"></i> ${data.punchline}
                    </div>
                </div>
            `;
        }

        function renderQuote(data, container) {
            container.innerHTML = `
                <div class="quote-card">
                    <span class="badge-chip" style="margin-bottom: 16px;">Tags: ${(data.tags || ['Inspirational']).join(', ')}</span>
                    <p class="quote-text">“${data.content || 'Everything is theoretically impossible, until it is done.'}”</p>
                    <div class="quote-author">— ${data.author || 'Robert A. Heinlein'}</div>
                </div>
            `;
        }

        function renderUser(user, container) {
            container.innerHTML = `
                <div class="user-card">
                    <img src="${user.picture.large}" alt="Avatar" class="user-avatar">
                    <div class="user-details">
                        <span class="badge-chip" style="margin-bottom: 8px;">Random User Profile</span>
                        <h3>${user.name.title} ${user.name.first} ${user.name.last}</h3>
                        <p><i class="fa-regular fa-envelope text-info"></i> ${user.email}</p>
                        <p><i class="fa-solid fa-location-dot text-danger"></i> ${user.location.city}, ${user.location.country}</p>
                        <p><i class="fa-solid fa-phone text-success"></i> ${user.phone}</p>
                    </div>
                </div>
            `;
        }

        // Fetch initial joke on load
        fetchCurrentApi();
    </script>
</body>
</html>
