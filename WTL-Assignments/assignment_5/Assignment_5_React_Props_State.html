<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React JSX Functional Components, Props & useState | WTL Assignment 5</title>
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel Standalone CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TailwindCSS for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4">

    <!-- Root Container for React -->
    <div id="root"></div>

    <!-- React Application Code with Babel JSX -->
    <script type="text/babel">
        const { useState } = React;

        // =========================================================================
        // INITIAL DATASET
        // =========================================================================
        const SAMPLE_COURSES = [
            {
                id: 101,
                title: "Full-Stack Web Development (MERN)",
                category: "Web Dev",
                instructor: "Prof. S. R. Kulkarni",
                credits: 4,
                rating: 4.9,
                price: "Free",
                tag: "Bestseller",
                description: "Master React, Node.js, Express, and MongoDB with real-world production projects."
            },
            {
                id: 102,
                title: "Theory of Computation & Automata",
                category: "Core CS",
                instructor: "Dr. A. B. Pawar",
                credits: 3,
                rating: 4.7,
                price: "Free",
                tag: "Core",
                description: "Deep dive into DFA, NFA, Regular Expressions, Context-Free Grammars and Turing Machines."
            },
            {
                id: 103,
                title: "Applied Machine Learning & Intelligent Systems",
                category: "AI & ML",
                instructor: "Dr. P. V. Deshmukh",
                credits: 4,
                rating: 4.8,
                price: "Free",
                tag: "Trending",
                description: "Practical ML algorithms: Regression, Classification, Neural Networks with Scikit-Learn & PyTorch."
            },
            {
                id: 104,
                title: "Network Security & Ethical Hacking",
                category: "Security",
                instructor: "Prof. N. K. Sharma",
                credits: 3,
                rating: 4.6,
                price: "Free",
                tag: "Hot",
                description: "Hands-on penetration testing, cryptography, Wireshark packet analysis, and OWASP Top 10."
            },
            {
                id: 105,
                title: "Modern TypeScript for Enterprise Applications",
                category: "Web Dev",
                instructor: "Gaurav Rajput",
                credits: 2,
                rating: 4.9,
                price: "Free",
                tag: "Featured",
                description: "Type safety, generics, utility types, and modern design patterns for scalable web apps."
            },
            {
                id: 106,
                title: "Database Engineering & SQL/NoSQL Optimization",
                category: "Core CS",
                instructor: "Prof. V. M. Joshi",
                credits: 3,
                rating: 4.5,
                price: "Free",
                tag: "Core",
                description: "Relational normalization, MySQL indexing, MongoDB sharding, and ACID transaction guarantees."
            }
        ];

        // =========================================================================
        // CHILD COMPONENT 1: Header (Receives props)
        // =========================================================================
        function Header(props) {
            return (
                <header className="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-6 mb-8 flex flex-wrap justify-between items-center gap-4 shadow-xl">
                    <div>
                        <div className="flex items-center gap-2 mb-1">
                            <span className="bg-indigo-500/20 text-indigo-400 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider border border-indigo-500/30">
                                WTL Lab Assignment 5
                            </span>
                        </div>
                        <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-300 to-purple-400">
                            {props.title}
                        </h1>
                        <p className="text-slate-400 text-sm mt-1">{props.subtitle}</p>
                    </div>

                    <div className="flex items-center gap-4">
                        <div className="bg-slate-900/90 border border-slate-700 px-4 py-2.5 rounded-xl flex items-center gap-3">
                            <i className="fa-solid fa-graduation-cap text-indigo-400 text-xl"></i>
                            <div>
                                <div className="text-xs text-slate-400 font-semibold uppercase">Enrolled Courses</div>
                                <div className="text-lg font-bold text-emerald-400">{props.enrolledCount} Courses ({props.totalCredits} Credits)</div>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        // =========================================================================
        // CHILD COMPONENT 2: CategoryFilter (Receives props & callbacks)
        // =========================================================================
        function CategoryFilter({ categories, activeCategory, onSelectCategory, searchQuery, onSearchChange }) {
            return (
                <div className="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4 mb-8 flex flex-wrap justify-between items-center gap-4">
                    <div className="flex flex-wrap gap-2">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => onSelectCategory(cat)}
                                className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${
                                    activeCategory === cat
                                        ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                                        : 'bg-slate-900/60 text-slate-400 hover:text-white hover:bg-slate-700/50'
                                }`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="relative w-full sm:w-72">
                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input
                            type="text"
                            placeholder="Search courses..."
                            value={searchQuery}
                            onChange={(e) => onSearchChange(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                        />
                    </div>
                </div>
            );
        }

        // =========================================================================
        // CHILD COMPONENT 3: CourseCard (Receives props for display & state handler)
        // =========================================================================
        function CourseCard({ course, isEnrolled, onToggleEnroll }) {
            return (
                <div className="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-6 flex flex-col justify-between hover:border-indigo-500/50 transition-all hover:-translate-y-1 shadow-lg">
                    <div>
                        <div className="flex justify-between items-start mb-3">
                            <span className="bg-indigo-950 text-indigo-400 text-xs px-2.5 py-1 rounded-md font-semibold border border-indigo-800">
                                {course.category}
                            </span>
                            <span className="text-amber-400 text-xs font-bold flex items-center gap-1">
                                <i className="fa-solid fa-star"></i> {course.rating}
                            </span>
                        </div>

                        <h3 className="text-lg font-bold text-white mb-2 leading-snug">{course.title}</h3>
                        <p className="text-slate-400 text-xs mb-4 line-clamp-2 leading-relaxed">{course.description}</p>

                        <div className="flex items-center gap-2 text-xs text-slate-400 mb-4 pb-4 border-b border-slate-700/60">
                            <i className="fa-regular fa-user text-indigo-400"></i>
                            <span>{course.instructor}</span>
                            <span className="mx-1">•</span>
                            <i className="fa-solid fa-award text-indigo-400"></i>
                            <span>{course.credits} Credits</span>
                        </div>
                    </div>

                    <div className="flex justify-between items-center mt-2">
                        <span className="text-emerald-400 font-bold text-sm">{course.price}</span>
                        <button
                            onClick={() => onToggleEnroll(course.id)}
                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all ${
                                isEnrolled
                                    ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30'
                                    : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30'
                            }`}
                        >
                            {isEnrolled ? (
                                <>
                                    <i className="fa-solid fa-check"></i> Enrolled (Drop)
                                </>
                            ) : (
                                <>
                                    <i className="fa-solid fa-plus"></i> Enroll Now
                                </>
                            )}
                        </button>
                    </div>
                </div>
            );
        }

        // =========================================================================
        // CHILD COMPONENT 4: EnrolledSummaryDrawer (Props-driven Summary)
        // =========================================================================
        function EnrolledSummaryDrawer({ enrolledCourses, onRemove, onClearAll }) {
            if (enrolledCourses.length === 0) return null;

            return (
                <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 mb-8 shadow-2xl">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-white flex items-center gap-2">
                            <i className="fa-solid fa-bookmark text-indigo-400"></i>
                            My Registered Course Schedule ({enrolledCourses.length})
                        </h3>
                        <button
                            onClick={onClearAll}
                            className="text-xs text-rose-400 hover:text-rose-300 underline font-semibold"
                        >
                            Drop All Courses
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {enrolledCourses.map(course => (
                            <div key={course.id} className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex justify-between items-center">
                                <div>
                                    <div className="text-sm font-semibold text-white truncate w-48">{course.title}</div>
                                    <div className="text-xs text-slate-400">{course.credits} Credits • {course.category}</div>
                                </div>
                                <button
                                    onClick={() => onRemove(course.id)}
                                    className="text-slate-400 hover:text-rose-400 p-1.5 transition-colors"
                                    title="Drop Course"
                                >
                                    <i className="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // ROOT COMPONENT: App (Central State Management with useState)
        // =========================================================================
        function App() {
            // 1. Central useState for courses dataset
            const [courses, setCourses] = useState(SAMPLE_COURSES);

            // 2. useState for user interactions (enrolled course IDs)
            const [enrolledIds, setEnrolledIds] = useState([101, 103]);

            // 3. useState for Category Filtering
            const [activeCategory, setActiveCategory] = useState('All');

            // 4. useState for Search Query
            const [searchQuery, setSearchQuery] = useState('');

            // Categories list for filter buttons
            const categories = ['All', 'Web Dev', 'Core CS', 'AI & ML', 'Security'];

            // State handler: Toggle enroll / drop
            const handleToggleEnroll = (courseId) => {
                if (enrolledIds.includes(courseId)) {
                    setEnrolledIds(enrolledIds.filter(id => id !== courseId));
                } else {
                    setEnrolledIds([...enrolledIds, courseId]);
                }
            };

            const handleClearAll = () => {
                setEnrolledIds([]);
            };

            // Computed values (Derived from State)
            const enrolledCourses = courses.filter(c => enrolledIds.includes(c.id));
            const totalCredits = enrolledCourses.reduce((sum, c) => sum + c.credits, 0);

            const filteredCourses = courses.filter(course => {
                const matchesCat = activeCategory === 'All' || course.category === activeCategory;
                const matchesSearch = course.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      course.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      course.instructor.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return (
                <div className="max-w-6xl mx-auto">
                    {/* Header Component - Props Passed */}
                    <Header
                        title="Course Enrollment & Elective Portal"
                        subtitle="Demonstrating React 18 JSX, Functional Components, Props passing & useState Hook"
                        enrolledCount={enrolledIds.length}
                        totalCredits={totalCredits}
                    />

                    {/* Enrolled Courses Drawer - Props Passed */}
                    <EnrolledSummaryDrawer
                        enrolledCourses={enrolledCourses}
                        onRemove={handleToggleEnroll}
                        onClearAll={handleClearAll}
                    />

                    {/* Filter & Search Component - Props & Callbacks Passed */}
                    <CategoryFilter
                        categories={categories}
                        activeCategory={activeCategory}
                        onSelectCategory={setActiveCategory}
                        searchQuery={searchQuery}
                        onSearchChange={setSearchQuery}
                    />

                    {/* Courses Grid - Rendering List with Props */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredCourses.length > 0 ? (
                            filteredCourses.map(course => (
                                <CourseCard
                                    key={course.id}
                                    course={course}
                                    isEnrolled={enrolledIds.includes(course.id)}
                                    onToggleEnroll={handleToggleEnroll}
                                />
                            ))
                        ) : (
                            <div className="col-span-full py-16 text-center text-slate-400 bg-slate-800/40 rounded-2xl border border-slate-700/50">
                                <i className="fa-regular fa-folder-open text-4xl mb-3 text-slate-500"></i>
                                <p className="text-base font-semibold">No courses found matching your criteria</p>
                                <button
                                    onClick={() => { setActiveCategory('All'); setSearchQuery(''); }}
                                    className="mt-3 text-indigo-400 text-sm font-semibold hover:underline"
                                >
                                    Reset Filters
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Technical Implementation Note for Examiner */}
                    <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-800 pt-6">
                        <p className="font-semibold text-slate-400">TY B.Tech Computer Engineering • WTL Assignment 5</p>
                        <p className="mt-1">
                            Concepts Demonstrated: Functional Components (<code className="text-indigo-400">Header</code>, <code className="text-indigo-400">CategoryFilter</code>, <code className="text-indigo-400">CourseCard</code>, <code className="text-indigo-400">EnrolledSummaryDrawer</code>),
                            Props Parameter Drilling, Event Handlers & State Management with <code className="text-indigo-400">useState()</code>.
                        </p>
                    </footer>
                </div>
            );
        }

        // Render root component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
