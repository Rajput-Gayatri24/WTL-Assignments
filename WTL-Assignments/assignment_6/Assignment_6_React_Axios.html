<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Axios API Data Fetcher | WTL Assignment 6</title>
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 30px 10px;
        }
        .header-box {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }
        .post-card {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }
        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.1);
            border-color: #93c5fd;
        }
        .meta-stat {
            background: white;
            border-radius: 12px;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://jsonplaceholder.typicode.com/posts';

        function AxiosApp() {
            // State: Data, Loading, and Error Management (Crucial for Assignment 6)
            const [posts, setPosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Additional interaction states
            const [limit, setLimit] = useState(9);
            const [searchQuery, setSearchQuery] = useState('');
            const [simulateError, setSimulateError] = useState(false);
            const [latency, setLatency] = useState(0);

            // Fetch data using Axios
            const fetchPosts = async () => {
                setLoading(true);
                setError(null);
                const startTime = performance.now();

                try {
                    // Simulate error endpoint if toggled
                    const endpoint = simulateError
                        ? 'https://jsonplaceholder.typicode.com/non-existent-broken-url-404'
                        : `${API_URL}?_limit=${limit}`;

                    // AXIOS GET REQUEST
                    const response = await axios.get(endpoint);
                    const endTime = performance.now();

                    setPosts(response.data);
                    setLatency(Math.round(endTime - startTime));
                } catch (err) {
                    // Handle Error States
                    console.error('Axios Error:', err);
                    setError(err.response ? `HTTP ${err.response.status}: Failed to fetch API` : err.message || 'Network request failed');
                } finally {
                    // Always reset loading state
                    setLoading(false);
                }
            };

            // Call on mount & when limit/simulateError changes
            useEffect(() => {
                fetchPosts();
            }, [limit, simulateError]);

            // Filter posts by search query
            const filteredPosts = posts.filter(post =>
                post.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                post.body.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="container max-w-5xl">
                    <!-- Header -->
                    <div className="header-box">
                        <div className="d-flex justify-content-between align-items-center flex-wrap gap-3">
                            <div>
                                <span className="badge bg-light text-primary fw-bold mb-2 px-3 py-2">
                                    <i className="bi bi-cloud-arrow-down me-1"></i> WTL Assignment 6
                                </span>
                                <h1 className="fw-bold mb-1">React + Axios API Integration</h1>
                                <p className="mb-0 text-white-50">
                                    Demonstrating Axios HTTP client, Component Lifecycle (useEffect), Loading Spinners & Error State Handling
                                </p>
                            </div>
                            <div className="text-end">
                                <button onClick={fetchPosts} className="btn btn-light fw-semibold text-primary px-4 py-2 rounded-pill shadow-sm">
                                    <i className="bi bi-arrow-clockwise me-1"></i> Refresh via Axios
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Diagnostics & Filter Controls Bar -->
                    <div className="row g-3 mb-4">
                        <div className="col-md-4">
                            <div className="meta-stat">
                                <i className="bi bi-database-check fs-3 text-primary"></i>
                                <div>
                                    <div className="small text-muted">Response Status</div>
                                    <div className="fw-bold text-success">{error ? 'Error' : '200 OK'} • {latency} ms</div>
                                </div>
                            </div>
                        </div>
                        <div className="col-md-4">
                            <div className="meta-stat">
                                <i className="bi bi-sliders fs-3 text-info"></i>
                                <div className="w-100">
                                    <div className="small text-muted">Posts Limit</div>
                                    <select
                                        className="form-select form-select-sm border-0 fw-bold p-0"
                                        value={limit}
                                        onChange={(e) => setLimit(Number(e.target.value))}
                                    >
                                        <option value="6">6 Posts</option>
                                        <option value="9">9 Posts</option>
                                        <option value="15">15 Posts</option>
                                        <option value="20">20 Posts</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div className="col-md-4">
                            <div className="meta-stat">
                                <i className="bi bi-exclamation-triangle fs-3 text-warning"></i>
                                <div className="d-flex align-items-center justify-content-between w-100">
                                    <div>
                                        <div className="small text-muted">Test Error State</div>
                                        <div className="small fw-semibold">{simulateError ? 'Error Active' : 'Normal Mode'}</div>
                                    </div>
                                    <div className="form-check form-switch m-0">
                                        <input
                                            className="form-check-input"
                                            type="checkbox"
                                            checked={simulateError}
                                            onChange={(e) => setSimulateError(e.target.checked)}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Search Input -->
                    <div className="mb-4">
                        <div className="input-group">
                            <span className="input-group-text bg-white border-end-0"><i className="bi bi-search text-muted"></i></span>
                            <input
                                type="text"
                                className="form-control border-start-0 py-2.5"
                                placeholder="Search posts fetched from API..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />
                        </div>
                    </div>

                    <!-- 1. LOADING STATE DISPLAY -->
                    {loading && (
                        <div className="text-center py-5 my-4 bg-white rounded-4 border">
                            <div className="spinner-border text-primary mb-3" style={{ width: '3rem', height: '3rem' }} role="status">
                                <span className="visually-hidden">Loading...</span>
                            </div>
                            <h5 className="fw-bold">Fetching Posts via Axios...</h5>
                            <p className="text-muted small mb-0">Managing front-end asynchronous loading state with useState()</p>
                        </div>
                    )}

                    <!-- 2. ERROR STATE DISPLAY -->
                    {!loading && error && (
                        <div className="alert alert-danger p-4 rounded-4 shadow-sm" role="alert">
                            <div className="d-flex align-items-center gap-3">
                                <i className="bi bi-x-octagon-fill fs-1 text-danger"></i>
                                <div>
                                    <h5 className="alert-heading fw-bold mb-1">Axios Request Encountered An Error!</h5>
                                    <p className="mb-2 text-danger-emphasis">{error}</p>
                                    <button onClick={() => { setSimulateError(false); fetchPosts(); }} className="btn btn-sm btn-danger rounded-pill">
                                        <i className="bi bi-arrow-repeat me-1"></i> Reset Error & Retry Fetch
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <!-- 3. SUCCESS DATA DISPLAY -->
                    {!loading && !error && (
                        <div className="row g-4">
                            {filteredPosts.map(post => (
                                <div className="col-lg-4 col-md-6" key={post.id}>
                                    <div className="post-card">
                                        <div>
                                            <div className="d-flex justify-content-between align-items-center mb-2">
                                                <span className="badge bg-primary-subtle text-primary fw-bold">Post #{post.id}</span>
                                                <span className="text-muted small">User ID: {post.userId}</span>
                                            </div>
                                            <h5 className="fw-bold text-dark text-capitalize mb-2" style={{ minHeight: '48px' }}>
                                                {post.title}
                                            </h5>
                                            <p className="text-muted small line-clamp-3 mb-3">
                                                {post.body}
                                            </p>
                                        </div>
                                        <div className="pt-2 border-top d-flex justify-content-between align-items-center">
                                            <span className="badge bg-light text-secondary">JSONPlaceholder</span>
                                            <button className="btn btn-sm btn-outline-primary rounded-pill px-3">
                                                Read More &rarr;
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AxiosApp />);
    </script>
</body>
</html>
