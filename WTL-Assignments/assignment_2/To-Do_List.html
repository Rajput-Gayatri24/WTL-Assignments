<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List Application | WTL Assignment 2</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome / Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .app-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Stats & Progress */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #818cf8;
        }

        .stat-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .progress-bar-container {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 100px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            transition: width 0.4s ease;
        }

        /* Add Task Form */
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .task-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-add {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-add:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .meta-selectors {
            display: flex;
            gap: 10px;
        }

        .select-custom {
            flex: 1;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-muted);
            outline: none;
            font-size: 0.85rem;
        }

        /* Search & Filters */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-filter {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-filter.active, .btn-filter:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 6px 12px 6px 32px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 120px;
        }

        .task-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .task-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }

        .task-item.completed {
            opacity: 0.6;
            background: rgba(15, 23, 42, 0.3);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox-custom i {
            font-size: 0.75rem;
            color: white;
            display: none;
        }

        .task-item.completed .checkbox-custom {
            background: var(--success);
            border-color: var(--success);
        }

        .task-item.completed .checkbox-custom i {
            display: block;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-text {
            font-size: 0.98rem;
            color: var(--text-main);
            word-break: break-word;
        }

        .task-badges {
            display: flex;
            gap: 6px;
            font-size: 0.7rem;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-category {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .badge-high {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .badge-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
        }

        .badge-low {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .action-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .action-btn.delete:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 35px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #475569;
        }

        .clear-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-clear {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-clear:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <h1>Dynamic To-Do List</h1>
            <p>WTL Lab Assignment 2 &bull; Interactive HTML, CSS & JavaScript</p>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="number" id="totalTasks">0</div>
                <div class="label">Total Tasks</div>
            </div>
            <div class="stat-box">
                <div class="number" id="completedTasks" style="color: var(--success);">0</div>
                <div class="label">Completed</div>
            </div>
            <div class="stat-box">
                <div class="number" id="pendingTasks" style="color: var(--warning);">0</div>
                <div class="label">Pending</div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Add Task Form -->
        <form class="task-form" id="todoForm" onsubmit="addTask(event)">
            <div class="input-row">
                <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done?..." required autocomplete="off">
                <button type="submit" class="btn-add">
                    <i class="fa-solid fa-plus"></i> Add Task
                </button>
            </div>
            <div class="meta-selectors">
                <select id="taskCategory" class="select-custom">
                    <option value="Study">📚 Study / College</option>
                    <option value="Coding">💻 Coding & Projects</option>
                    <option value="Work">💼 Work & Career</option>
                    <option value="Personal">🌟 Personal</option>
                </select>
                <select id="taskPriority" class="select-custom">
                    <option value="High">🔴 High Priority</option>
                    <option value="Medium" selected>🟡 Medium Priority</option>
                    <option value="Low">🟢 Low Priority</option>
                </select>
            </div>
        </form>

        <!-- Controls: Filters & Search -->
        <div class="controls-row">
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setFilter('all', this)">All</button>
                <button class="btn-filter" onclick="setFilter('active', this)">Active</button>
                <button class="btn-filter" onclick="setFilter('completed', this)">Completed</button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search tasks..." oninput="renderTasks()">
            </div>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="taskList">
            <!-- Dynamic Items Generated by JavaScript -->
        </ul>

        <!-- Footer / Clear Action -->
        <div class="clear-footer">
            <span id="itemsLeftText">0 items left</span>
            <button class="btn-clear" onclick="clearCompleted()">Clear Completed</button>
        </div>
    </div>

    <script>
        // Store tasks in localStorage
        const STORAGE_KEY = 'wtl_assignment2_todos';
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            { id: 1, text: 'Complete WTL Assignment 1 Homepage with Bootstrap', category: 'Study', priority: 'High', completed: true },
            { id: 2, text: 'Build interactive To-Do App with JavaScript DOM', category: 'Coding', priority: 'High', completed: false },
            { id: 3, text: 'Revise Express.js REST API and MongoDB schema', category: 'Study', priority: 'Medium', completed: false }
        ];

        let currentFilter = 'all';

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('totalTasks').innerText = total;
            document.getElementById('completedTasks').innerText = completed;
            document.getElementById('pendingTasks').innerText = pending;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('itemsLeftText').innerText = `${pending} item${pending === 1 ? '' : 's'} left`;
        }

        function setFilter(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderTasks();
        }

        function addTask(event) {
            event.preventDefault();
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;

            const newTask = {
                id: Date.now(),
                text: text,
                category: category,
                priority: priority,
                completed: false
            };

            tasks.unshift(newTask);
            saveTasks();
            input.value = '';
            renderTasks();
        }

        function toggleComplete(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            const updatedText = prompt('Edit your task:', task.text);
            if (updatedText !== null && updatedText.trim() !== '') {
                task.text = updatedText.trim();
                saveTasks();
                renderTasks();
            }
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const query = (document.getElementById('searchInput').value || '').toLowerCase();

            let filtered = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (query) {
                filtered = filtered.filter(task => task.text.toLowerCase().includes(query) || task.category.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-clipboard"></i>
                        <p>No tasks found ${query ? 'matching "' + query + '"' : 'for this filter'}. Add a new task above!</p>
                    </div>
                `;
                updateStats();
                return;
            }

            list.innerHTML = filtered.map(task => `
                <li class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-left">
                        <div class="checkbox-custom" onclick="toggleComplete(${task.id})">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="task-info">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                            <div class="task-badges">
                                <span class="badge badge-category">${task.category}</span>
                                <span class="badge badge-${task.priority.toLowerCase()}">${task.priority}</span>
                            </div>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="action-btn" title="Edit" onclick="editTask(${task.id})">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button class="action-btn delete" title="Delete" onclick="deleteTask(${task.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </li>
            `).join('');

            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial render
        renderTasks();
    </script>
</body>
</html>
